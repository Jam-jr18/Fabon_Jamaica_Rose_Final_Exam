<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Management System</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Sidebar -->
  <div class="sidebar">

    <div class="logo">
      <h2>🎓 SIMS</h2>
      <p>Student System</p>
    </div>

    <ul class="menu">

      <li>
        <button onclick="showPage('dashboard')">
          🏠 Dashboard
        </button>
      </li>

      <li>
        <button onclick="showPage('register')">
          ➕ Register
        </button>
      </li>

      <li>
        <button onclick="showPage('students')">
          👥 Students
        </button>
      </li>

    </ul>

  </div>

  <!-- Main -->
  <div class="main">

    <!-- Dashboard -->
    <section id="dashboard" class="page active">

      <div class="hero">
        <div>
          <h1>Student Information Management System</h1>

          <p>
            Modern dashboard design with CRUD functionality.
          </p>

          <button onclick="showPage('register')">
            Add Student
          </button>
        </div>

        <div class="hero-icon">
          🎓
        </div>
      </div>

      <div class="stats">

        <div class="card">
          <h2 id="totalStudents">0</h2>
          <p>Total Students</p>
        </div>

        <div class="card">
          <h2>5</h2>
          <p>Courses</p>
        </div>

        <div class="card">
          <h2>CRUD</h2>
          <p>Operations</p>
        </div>

      </div>

    </section>

    <!-- Register -->
    <section id="register" class="page">

      <div class="form-container">

        <h2>Register Student</h2>

        <form id="studentForm">

          <input type="text" id="studentId" placeholder="Student ID" required>

          <input type="text" id="fullName" placeholder="Full Name" required>

          <select id="course" required>
            <option value="">Select Course</option>
            <option>BS Computer Science</option>
            <option>BS Information Technology</option>
            <option>BS Information Systems</option>
            <option>BS Computer Engineering</option>
            <option>BS Data Science</option>
          </select>

          <select id="yearLevel" required>
            <option value="">Year Level</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
          </select>

          <input type="email" id="email" placeholder="Email Address" required>

          <button type="submit">
            Save Student
          </button>

        </form>

      </div>

    </section>

    <!-- Students -->
    <section id="students" class="page">

      <div class="table-container">

        <div class="table-header">

          <h2>Student Records</h2>

          <input
            type="text"
            id="search"
            placeholder="Search..."
            onkeyup="searchStudents()"
          >

        </div>

        <table>

          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Course</th>
              <th>Year</th>
              <th>Email</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="studentTable"></tbody>

        </table>

      </div>

    </section>

  </div>

  <script src="script.js"></script>

</body>
</html>
